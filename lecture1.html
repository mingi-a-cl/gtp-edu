<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Factory 전환을 위한 AI Agent의 단계적 도입전략 — 강의자료</title>
<style>
*{box-sizing:border-box}
html{overflow-x:hidden}
body{margin:0}
body{background:#DDE2EA;color:#111B2B;font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;-webkit-text-size-adjust:100%}
#bar{position:sticky;top:0;z-index:50;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#111B2B;color:#F7F5F0;font-size:15px}
#bar b{margin-right:auto;font-size:15px;min-width:0}
#bar a,#bar button{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;text-decoration:none;white-space:nowrap;cursor:pointer;text-align:center}
#bar .vb-back,#bar button{color:#F7F5F0;border:1px solid #5B6B85;background:#1E2C44}
#bar .vb-pdf{color:#fff;background:#1F5FBF;border:1px solid #1F5FBF}
#tip{max-width:960px;margin:14px auto 0;padding:0 16px;font-size:14px;line-height:1.6;color:#4A5568;display:none}
#status{max-width:960px;margin:24px auto;padding:0 16px;font-size:15px;color:#4A5568;text-align:center}
#pages{max-width:1200px;margin:0 auto;padding:16px 10px 40px}
.pg{position:relative;width:100%;margin:0 auto 14px;background:#fff;box-shadow:0 1px 4px rgba(17,27,43,.18)}
.pg canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pg .no{position:absolute;right:8px;bottom:6px;font-size:11px;color:#8A94A6}
/* 한 장씩 보기 */
#show{display:none;position:fixed;inset:0;z-index:100;background:#000;touch-action:pan-y}
#show canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff}
#show .cnt{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);font-size:14px;color:#ddd;background:rgba(0,0,0,.45);padding:4px 12px;border-radius:14px}
#show .x{position:fixed;top:12px;right:12px;z-index:2;font:600 15px 'Noto Sans KR',sans-serif;padding:8px 14px;border-radius:20px;border:0;background:rgba(255,255,255,.88);color:#111;cursor:pointer}
#show .nav{position:fixed;top:50%;transform:translateY(-50%);z-index:2;width:44px;height:64px;border:0;border-radius:8px;background:rgba(255,255,255,.18);color:#fff;font-size:26px;cursor:pointer}
#show .prev{left:8px} #show .next{right:8px}
body.presenting{overflow:hidden}
body.presenting #show{display:block}
@media (max-width:760px){
  #tip{display:block}
  #bar b{flex-basis:100%;order:-1;margin:0 0 4px}
  #bar a,#bar button{flex:1 1 auto;font-size:14px}
  #pages{padding:12px 6px 30px}
  .pg{margin-bottom:10px}
  #show .nav{display:none}
}
@media (hover:none){
  #show .nav{display:none}
}
</style>
</head>
<body>
<div id="bar">
  <a class="vb-back" href="./">← 강의자료 목록</a>
  <b>AI Factory 전환을 위한 AI Agent의 단계적 도입전략</b>
  <button id="bShow" type="button">한 장씩 크게 보기</button>
  <a class="vb-pdf" href="lecture1_microsoft.pdf" download="1_AI_Agent_단계적_도입전략_최윤석.pdf">PDF 다운로드</a>
</div>
<p id="tip">휴대폰에서는 <b>[한 장씩 크게 보기]</b>를 누르고 화면을 가로로 돌리면 더 크게 볼 수 있습니다. (화면 오른쪽 탭: 다음, 왼쪽 탭: 이전)</p>
<p id="status">강의자료를 불러오는 중입니다…</p>
<div id="pages"></div>

<div id="show" aria-hidden="true">
  <canvas id="sc"></canvas>
  <button class="x" type="button" id="bClose">✕ 닫기</button>
  <button class="nav prev" type="button" id="bPrev" aria-label="이전">‹</button>
  <button class="nav next" type="button" id="bNext" aria-label="다음">›</button>
  <span class="cnt" id="cnt"></span>
</div>

<script src="pdf.js"></script>
<script>
(function(){
  var PDF='lecture1_microsoft.pdf';
  var status=document.getElementById('status'), wrap=document.getElementById('pages');
  if(!window.pdfjsLib){status.innerHTML='화면을 불러오지 못했습니다. <a href="'+PDF+'">PDF로 보기</a>';return;}
  pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.js';
  var doc=null, ratio=540/959.76, boxes=[], cur=1;
  var DPR=Math.min(window.devicePixelRatio||1,2.5);

  function renderInto(canvas,num,cssW,cssH){
    return doc.getPage(num).then(function(page){
      var v0=page.getViewport({scale:1});
      var sc=Math.min(cssW/v0.width,cssH/v0.height)*DPR;
      var vp=page.getViewport({scale:sc});
      canvas.width=Math.floor(vp.width); canvas.height=Math.floor(vp.height);
      return page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
    });
  }

  // 목록 보기: 화면에 가까워진 페이지만 그림
  var io=('IntersectionObserver' in window)?new IntersectionObserver(function(es){
    es.forEach(function(e){
      var el=e.target, n=+el.dataset.n;
      if(e.isIntersecting){
        if(!el.dataset.done){ el.dataset.done='1';
          var c=document.createElement('canvas'); el.insertBefore(c,el.firstChild);
          renderInto(c,n,el.clientWidth,el.clientHeight).catch(function(){el.dataset.done='';c.remove();});
        }
      }
    });
  },{rootMargin:'800px 0px'}):null;

  pdfjsLib.getDocument({url:PDF,disableAutoFetch:true}).promise.then(function(d){
    doc=d; status.style.display='none';
    for(var i=1;i<=doc.numPages;i++){
      var el=document.createElement('div'); el.className='pg'; el.dataset.n=i;
      el.style.paddingTop=(ratio*100)+'%';
      el.innerHTML='<span class="no">'+i+' / '+doc.numPages+'</span>';
      el.addEventListener('click',(function(n){return function(){open(n);};})(i));
      wrap.appendChild(el); boxes.push(el);
      if(io) io.observe(el); else { el.dataset.done='1'; var c=document.createElement('canvas'); el.insertBefore(c,el.firstChild); renderInto(c,i,el.clientWidth,el.clientHeight); }
    }
  }).catch(function(){
    status.innerHTML='강의자료를 불러오지 못했습니다. 위의 <b>[PDF 다운로드]</b>를 눌러 내려받아 보세요.';
  });

  // 화면 크기가 바뀌면(가로 돌리기 등) 다시 선명하게
  var rt; addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(function(){
    boxes.forEach(function(el){ if(el.dataset.done){ el.dataset.done=''; var c=el.querySelector('canvas'); if(c)c.remove(); if(io){io.unobserve(el);io.observe(el);} } });
    if(document.body.classList.contains('presenting')) draw();
  },250); });

  // 한 장씩 크게 보기
  var show=document.getElementById('show'), sc=document.getElementById('sc'), cnt=document.getElementById('cnt'), token=0;
  function draw(){
    if(!doc) return; var t=++token, W=innerWidth, H=innerHeight;
    cnt.textContent=cur+' / '+doc.numPages;
    var tmp=document.createElement('canvas');
    renderInto(tmp,cur,W,H).then(function(){
      if(t!==token) return;
      sc.width=tmp.width; sc.height=tmp.height; sc.getContext('2d').drawImage(tmp,0,0);
      sc.style.width=(tmp.width/DPR)+'px'; sc.style.height=(tmp.height/DPR)+'px';
    });
  }
  function open(n){
    if(!doc) return; cur=n||cur; document.body.classList.add('presenting'); show.setAttribute('aria-hidden','false');
    if(show.requestFullscreen && innerWidth>=760){ show.requestFullscreen().catch(function(){}); }
    draw();
  }
  function close(){
    if(document.fullscreenElement&&document.exitFullscreen){document.exitFullscreen().catch(function(){});}
    document.body.classList.remove('presenting'); show.setAttribute('aria-hidden','true');
    if(boxes[cur-1]) boxes[cur-1].scrollIntoView({block:'center'});
  }
  function go(d){ if(!doc) return; var n=cur+d; if(n<1||n>doc.numPages) return; cur=n; draw(); }
  function firstVisible(){ for(var i=0;i<boxes.length;i++){ var r=boxes[i].getBoundingClientRect(); if(r.bottom>80) return i+1; } return 1; }

  document.getElementById('bShow').addEventListener('click',function(){ open(firstVisible()); });
  document.getElementById('bClose').addEventListener('click',function(e){e.stopPropagation();close();});
  document.getElementById('bPrev').addEventListener('click',function(e){e.stopPropagation();go(-1);});
  document.getElementById('bNext').addEventListener('click',function(e){e.stopPropagation();go(1);});
  show.addEventListener('click',function(e){ go(e.clientX<innerWidth/2?-1:1); });
  document.addEventListener('fullscreenchange',function(){ if(!document.fullscreenElement && document.body.classList.contains('presenting')) setTimeout(draw,150); });
  addEventListener('keydown',function(e){
    if(!document.body.classList.contains('presenting')) return;
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(1);}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(-1);}
    else if(e.key==='Escape'){close();}
  });
  var sx=null; show.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;},{passive:true});
  show.addEventListener('touchend',function(e){ if(sx===null)return; var dx=e.changedTouches[0].clientX-sx; sx=null;
    if(Math.abs(dx)>50){ e.preventDefault(); go(dx<0?1:-1); } });
})();
</script>
</body>
</html>
